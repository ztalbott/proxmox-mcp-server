[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-mcp"
version = "1.0.0"
description = "MCP server for Proxmox VE homelab management"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "proxmoxer>=2.0.0",
    "requests>=2.31.0",
    "paramiko>=3.4.0",
    "python-dotenv>=1.0.0",
    # Imported directly by server.py for the HTTP transport modes (also pulled in
    # transitively by mcp, but declared here since we import them directly).
    "starlette>=0.27",
    "uvicorn>=0.31.1; sys_platform != 'emscripten'",
]

[project.scripts]
proxmox-mcp = "proxmox_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
