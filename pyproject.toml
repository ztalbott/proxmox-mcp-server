[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxmox-mcp"
version = "1.0.0"
description = "MCP server for Proxmox VE homelab management"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "proxmoxer>=2.0.0",
    "requests>=2.31.0",
    "paramiko>=3.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
proxmox-mcp = "proxmox_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
